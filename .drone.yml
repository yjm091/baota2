kind: pipeline
type: docker
name: deploy-to-baota

# 1. 禁用默认克隆
clone:
  disable: true

steps:
# 2. 手动克隆步骤（加上代理）
- name: clone
  image: alpine/git
  environment:
    # 把这里的 .151 改成 .155
    HTTP_PROXY: http://192.168.155.142:7890
    HTTPS_PROXY: http://192.168.155.142:7890
  commands:
    - git clone https://github.com/yjm091/baota.git .
# 3. 传输文件到宝塔
- name: scp-files
  image: appleboy/drone-scp
  settings:
    host:
      from_secret: baota_host
    username:
      from_secret: baota_user
    port: 2222
    key:
      from_secret: ssh_private_key
    source: ./* 
    target: /www/wwwroot/default/
    overwrite: true